<!--For the retrival of credentials-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clinic Login</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #1f2937; }
        main { width: min(100% - 2rem, 24rem); padding: 2rem; border-radius: 12px; background: white; box-shadow: 0 12px 36px #1f29371a; }
        h1 { margin-top: 0; }
        label { display: block; margin: 1rem 0 .4rem; font-weight: 600; }
        input, select, button { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #cbd5e1; border-radius: 6px; font: inherit; }
        button { margin-top: 1.25rem; border: 0; background: #1769aa; color: white; font-weight: 700; cursor: pointer; }
        .message { margin: 1rem 0 0; color: #b42318; }
        .success { color: #067647; }
    </style>
</head>
<body>
<main>
    <h1>Smart Clinic Login</h1>
    <form th:action="@{/login}" method="post">
        <label for="userType">Sign in as</label>
        <select id="userType" name="userType" required>
            <option value="ADMIN">Admin</option>
            <option value="DOCTOR">Doctor</option>
            <option value="PATIENT">Patient</option>
        </select>

        <label for="username" id="usernameLabel">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Log in</button>
    </form>
    <p class="message" th:if="${param.error}">Invalid username, password, or account type.</p>
    <p class="message success" th:if="${param.logout}">You have been logged out.</p>
</main>
<script>
    const userType = document.getElementById("userType");
    const usernameLabel = document.getElementById("usernameLabel");
    const usernameInput = document.getElementById("username");
    function updateIdentifierLabel() {
        const isAdmin = userType.value === "ADMIN";
        usernameLabel.textContent = isAdmin ? "Username" : "Email";
        usernameInput.type = isAdmin ? "text" : "email";
        usernameInput.autocomplete = isAdmin ? "username" : "email";
    }
    userType.addEventListener("change", updateIdentifierLabel);
    updateIdentifierLabel();
</script>
</body>
</html>
